name: Build Android APK with Docker

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with Buildozer Action
        uses: kivy/buildozer-action@v1
        with:
          filename: buildozer.spec
          android_release: false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netsnitchx-apk
          path: bin/*.apk
